# Ten-iteration smoke run of the instantaneous trainer; a debug surface, not a paper result.
# historical campaign: inst_10iter
# x64 false: the trainer and its production trajectories are float32.
experiment: instantaneous_train
x64: false
iteration: 1
mask_layout: constriction_focused
num_steps: 50
learning_rate: 2.0e-1
global_scalar_lr_scale: 0.1
M: 6
inner_steps: 400
outer_steps: 200
pressure_gradient: 5.0
ref_eta_inf: 0.02
ref_eta_0: 1.0
ref_lambda: 5.0
ref_n: 0.7
ref_a: 2.0
use_soft_newtonian_init: true
use_warmup_tail: true
warmup_steps: 190
tail_steps: 10
visc_loss: true
reg_gamma_min: 1.0e-1
reg_gamma_max: 1.0e1
reg_num_points: 128
reg_s_cap: 0.60
reg_lambda_slope: 1.0e-3
reg_lambda_curv: 3.0e-4
reg_curv_cap_abs: 0.5
shape_loss: true
shape_weight: 0.5
s_floor: 0.35
alpha_temp: 0.8
freeze_eta0: true
eta0_fixed: 1.0
eta0_eps: 1.0e-5
mu_min_gamma: 1.5e-1
mu_max_gamma: 1.0e1
gate_gamma: 1.5e-1
gate_width_z: 0.5
enable_grad_equalizer: true
equalize_target: mix
equalize_cap_ratio: 1.0
freeze_centers: true
log_head: true
log_mixing: add
save_traj_info: true
