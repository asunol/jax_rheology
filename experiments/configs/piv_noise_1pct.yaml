# PIV-twin training at the 32x16 window with added noise at 1.0 percent of U95.
# Sweep generator slurm/submit_noise_sweep_varied_seed.sh; see the Supplementary Figs. S4-S6 row of REPRODUCE.md.
# x64 false: the PIV runner and its trajectories are float32.
experiment: piv_sweep
x64: false
iteration: 1
num_steps: 1
learning_rate: 5.0e-2
architecture: [16]
M: 12
global_scalar_lr_scale: 10.0
inner_steps: 400
outer_steps: 2000
pressure_gradient: 5.0
ref_eta_inf: 0.02
ref_eta_0: 1.0
ref_lambda: 5.0
ref_n: 0.7
ref_a: 2.0
use_soft_newtonian_init: true
use_warmup_tail: true
warmup_steps: 1990
tail_steps: 10
visc_loss: true
reg_gamma_min: 1.0e-1
reg_gamma_max: 1.0e1
reg_num_points: 128
reg_s_cap: 0.60
reg_lambda_slope: 1.0e-3
reg_lambda_curv: 3.0e-4
reg_curv_cap_abs: 0.5
shape_loss: true
shape_weight: 0.5
s_floor: 0.35
alpha_temp: 0.8
freeze_eta0: true
eta0_fixed: 1.0
eta0_eps: 1.0e-5
mu_min_gamma: 1.0e-1
mu_max_gamma: 1.0e1
gate_gamma: 1.0e-1
gate_width_z: 0.5
enable_grad_equalizer: true
equalize_target: mix
equalize_cap_ratio: 1.0
log_head: true
log_mixing: add
two_stage_etainf_then_curv: true
stage1_steps_etainf: 20
stage2_steps_curv: 50
stage1_etainf_only: true
stage1_reset_momentum: true
stage1_early_stop_on_flip: true
resolution_piv: true
piv_W_win: [32, 16]
piv_overlap: 0.75
piv_kernel: hann
add_piv_noise: true
piv_noise_p_percent: 1.0
piv_noise_corr_frac: 0.35
piv_noise_beta_grad: 0.5
piv_noise_use_bias: true
piv_noise_seed: 1453
save_traj_info: true
