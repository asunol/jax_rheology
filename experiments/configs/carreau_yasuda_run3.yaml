# Instantaneous TBNN training run 3 of seven on the published constriction_focused mask.
# historical campaign: inst_run3 (frozen run directory cy_param_04_20251011_032025)
# See the Fig. 2 / Fig. 4 / Table S1 rows of REPRODUCE.md.
# x64 false: the trainer and its production trajectories are float32. Seed is 42 + iteration (4).
experiment: instantaneous_train
x64: false
iteration: 4
frozen_dir: cy_param_04_20251011_032025
mask_layout: constriction_focused
architecture: [16]
M: 12
num_steps: 1
learning_rate: 0.05
global_scalar_lr_scale: 10.0
inner_steps: 400
outer_steps: 2000
pressure_gradient: 5.0
ref_eta_inf: 0.012
ref_eta_0: 1.0
ref_lambda: 1.0
ref_n: 0.6
ref_a: 2.0
use_soft_newtonian_init: true
s_floor: 0.35
alpha_temp: 0.8
freeze_eta0: true
eta0_fixed: 1.0
eta0_eps: 1.0e-5
mu_min_gamma: 0.1
mu_max_gamma: 10.0
gate_gamma: 0.1
gate_width_z: 0.5
use_warmup_tail: true
warmup_steps: 1990
tail_steps: 10
visc_loss: true
reg_gamma_min: 0.1
reg_gamma_max: 10.0
reg_num_points: 128
reg_s_cap: 0.6
reg_lambda_slope: 0.001
reg_lambda_curv: 0.0003
reg_curv_cap_abs: 0.5
shape_loss: true
shape_weight: 0.5
freeze_centers: true
two_stage_etainf_then_curv: true
stage1_steps_etainf: 20
stage2_steps_curv: 100
stage1_etainf_only: true
stage1_reset_momentum: true
stage1_early_stop_on_flip: true
log_head: true
log_mixing: add
enable_grad_equalizer: true
equalize_target: mix
equalize_cap_ratio: 1.0
save_traj_info: true
