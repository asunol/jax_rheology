# Production FENE-P single-rate contraction fit at U=0.5 (Supplementary Fig. S11).
# historical campaign: fene8_pinned (frozen run tags fene8_u05_*, and fene8_leg_* for the dual-rate arm)
# Launched by slurm/run_fenep_single_rate_prod.sh, which adds only the per-run knobs; see the Supplementary Fig. S11 row of REPRODUCE.md.
# x64 true is required by the contraction trainer; rate_balance legacy is the numerical equivalent of the pinned-era driver.
experiment: contraction_train
x64: true
truth_model: fene_p
scheme: s4
truth_gp: 3.2
truth_lam: 0.7
truth_nus: 0.8
truth_lsq: 12.0
gp_init: 1.0
lam_init: 1.0
nus_init: 1.0
learning_rate: 5.0e-4
warmup: 20
clip: 1.0
scalar_lr2: 2.0e-3
stage1_ftol: 1.0e-9
scalar_bound_lo: 0.02
scalar_bound_hi: 20.0
width: 32
depth: 2
bound_c: 3.0
seed: 0
time_budget_s: 165600.0
H: 1.0
ratio: 4.0
L_up: 6.0
L_down: 12.0
cells_per_H: 6.0
U: 0.5
U_list: null
density: 1.0
dt: 1.0e-4
inner_steps: 50
outer_steps: 400
ramp_time: 1.0
solver_tol: 1.0e-10
solver_maxiter: 300
no_stretch_weight: false
loss_weight: roi
roi_a: 0.5
roi_c: 1.75
roi_ell: 0.4
roi_sigma_y: 0.4
roi_kappa: 4.0
roi_xc: 0.0
beta: null
eta0: 3.04
nx: 128
ny: 256
w_p: 0.0
w_p_scale: null
n_sub: 8
dump_norms: null
norms_json: ./reference_values/fenep_rate_balance_norms.json
grad_probe: false
checkpoint_every: 25
out_dir: ./work/fenep_single_rate
run_name: null
curriculum_ulist: null
curriculum_gate_after: 1
curriculum_gate_lam_margin: 1.5
curriculum_max_pairs: 4
rate_balance: legacy
